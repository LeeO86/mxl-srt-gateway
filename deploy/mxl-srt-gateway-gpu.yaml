apiVersion: apps/v1
kind: Deployment
metadata:
  name: mxl-srt-gateway-gpu
  labels:
    app.kubernetes.io/name: mxl-srt-gateway
    app.kubernetes.io/component: gpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mxl-srt-gateway
      app.kubernetes.io/component: gpu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mxl-srt-gateway
        app.kubernetes.io/component: gpu
    spec:
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 30
      securityContext:
        supplementalGroups: [1000]
      containers:
        - name: gateway
          image: ghcr.io/leeo86/mxl-srt-gateway:1.3.1
          env:
            - name: DECODER
              value: auto
            - name: ENCODER
              value: auto
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility,video
            - name: WEB_PORT
              value: "8120"
            - name: MXL_DOMAIN_SCAN_PATH
              value: /Volumes/mxl
            - name: MXL_OUTPUT_DOMAIN_DIR
              value: /Volumes/mxl/srtgw-gpu
            - name: MXL_CLEANUP_ON_EXIT
              value: "true"
            - name: STATE_DIR
              value: /config
            - name: SHUTDOWN_TIMEOUT_S
              value: "10"
            - name: NMOS_HOST_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            limits:
              nvidia.com/gpu: "1"
              cpu: "8"
              memory: 16Gi
          volumeMounts:
            - name: mxl
              mountPath: /Volumes/mxl
            - name: config
              mountPath: /config
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
      volumes:
        - name: mxl
          hostPath:
            path: /Volumes/mxl
            type: DirectoryOrCreate
        - name: config
          emptyDir: {}
